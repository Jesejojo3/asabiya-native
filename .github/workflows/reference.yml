name: Legacy reference integrity
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/verify-reference.mjs
      - run: node tools/reference-smoke.mjs
